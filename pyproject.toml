[project]
name = "video-relator"
version = "0.1.0"
description = "Transcribe a video's narration and re-narrate it with a synthetic voice and background music."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "piper-tts>=1.8.0",
]

[project.scripts]
video-relator = "video_relator.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
